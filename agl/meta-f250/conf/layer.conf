# meta-f250: the F-250 head unit on AGL (Phase 5.4, ADR-0017).
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "f250"
BBFILE_PATTERN_f250 = "^${LAYERDIR}/"
# Above meta-agl-demo (70), so our appends are applied after AGL's.
BBFILE_PRIORITY_f250 = "80"

LAYERVERSION_f250 = "1"
LAYERSERIES_COMPAT_f250 = "wrynose"
LAYERDEPENDS_f250 = "core aglcore agldemo raspberrypi flutter-layer"

# Static user and group IDs (AGL requires them). :append, because AGL's
# distro config assigns these lists after this file is read.
USERADD_UID_TABLES:append = " files/f250-passwd"
USERADD_GID_TABLES:append = " files/f250-group"
