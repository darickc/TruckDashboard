# F-250 head unit: hands-free calling (ADR-0045). Installed into
# /etc/wireplumber/wireplumber.conf.d/ by f250-calls-config.service only when
# AUDIO_CALL_MIC is set in /etc/default/f250, and removed when it isn't: a
# hands-free unit that can't hear the driver would be worse than none.
# Loaded after 60-f250-bluetooth.conf, whose monitor.bluez.properties this
# overrides.
#
# - bluez5.roles: the A2DP sink as before, and hfp_hf: phones see a
#   hands-free unit and route calls to it while connected.
# - bluez5.hfphsp-backend "native": PipeWire's own HFP, not oFono (disabled
#   in these images); bluetoothd runs with --noplugin=hfp so BlueZ's
#   experimental hands-free doesn't compete (50-f250.conf).
# - bluez5.telephony.use-system-bus: the Telephony service
#   (org.pipewire.Telephony) on the system bus, where audio-manager (user
#   f250) follows and drives calls; f250-telephony.conf is its policy.
#
# Sources: PipeWire 1.6.8 doc/dox/config/pipewire-props.7.md and
# spa/plugins/bluez5/telephony.c. These three settings made the service
# level connection and registered the gateway with an iPhone and the
# owner's Z Fold8 on the bench Pi in spike S1 (bench-log 2026-11-14).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink hfp_hf ]
  bluez5.hfphsp-backend = "native"
  bluez5.telephony.use-system-bus = true
}
