# F-250 head unit: the 8-output DAC (ADR-0014) always starts in its
# "pro-audio" profile, one 8-channel sink (AUX0..AUX7), which audio-manager's
# filter-chain feeds (AUDIO_DAC_NODE in /etc/default/f250).
#
# Why: AGL runs WirePlumber stateless (20-AGL-profiles.conf), and the card's
# best-priority profile is "output:stereo-fallback", a 2-channel sink on the
# first jack pair only. A profile picked by hand (wpctl set-profile) is gone
# at the next boot. device/find-preferred-profile.lua (WirePlumber 0.5.14)
# reads these rules.
#
# The card is the RaspiAudio 8xOUT, which the hifiberry-dac8x overlay drives
# (its HAT EEPROM loads the overlay); the HiFiBerry DAC8x has the same card
# name. Status: [BENCH] 2026-11-15 (docs/hardware/bench-log.md).
device.profile.priority.rules = [
  {
    matches = [
      { api.alsa.card.name = "snd_rpi_hifiberry_dac8x" }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]
