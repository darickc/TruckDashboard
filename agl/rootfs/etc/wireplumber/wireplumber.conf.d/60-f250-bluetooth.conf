# F-250 head unit (ADR-0039): Bluetooth is for a phone to play music to the
# head unit, nothing else. Loaded after AGL's 30-AGL-bluetooth.conf
# (wireplumber-config-agl), whose monitor.bluez.properties this overrides.
#
# - bluez5.roles: only the A2DP sink, so the head unit is offered to phones
#   as a speaker and never as a headset, a source or LE Audio. WirePlumber
#   0.5.14's default is [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf
#   hfp_ag ] (docs/rst/daemon/configuration/bluetooth.rst). Hands-free
#   calling is later (audio-routing.md), and oFono, which AGL's
#   hfphsp-backend names, is disabled in these images.
# - The phone's stream keeps AGL's media.role "Multimedia" (30-AGL-bluetooth
#   .conf), so a navigation prompt (role "Navigation") ducks it.
#
# Status: UNVERIFIED on the Pi (the meta-f250 image hasn't carried PipeWire
# before ADR-0039).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.hfphsp-backend = "none"
}
