<!-- obexd as user f250 on the system bus (f250-obexd.service, ADR-0042).
     BlueZ's own obex.conf lets only root own org.bluez.obex and lets anyone
     send to it; this adds the owner. audio-manager (also user f250) is the
     only client that uses it. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="f250">
    <allow own="org.bluez.obex"/>
    <allow send_destination="org.bluez.obex"/>
  </policy>
</busconfig>
