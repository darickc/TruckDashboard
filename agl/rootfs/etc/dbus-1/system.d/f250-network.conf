<!-- services/network as user f250 on the system bus (f250-network.service,
     ADR-0052): it reads connman and asks it to scan and to join, leave and
     forget Wi-Fi networks, and registers an agent (net.connman.Agent) that
     hands connman the passphrase typed on the dashboard.

     connman's own policy lets root and the console's user talk to it; this
     adds user f250. Root (connmand) may call the agent: connman's policy
     allows its sends to net.connman.Agent, and this says so again in case
     the image's copy doesn't. UNVERIFIED on the Pi. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="f250">
    <allow send_destination="net.connman"/>
  </policy>
  <policy user="root">
    <allow send_interface="net.connman.Agent"/>
  </policy>
</busconfig>
