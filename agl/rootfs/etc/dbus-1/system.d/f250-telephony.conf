<!-- PipeWire's Telephony service on the system bus (ADR-0045): with
     bluez5.telephony.use-system-bus (61-f250-calls.conf, only when a call
     microphone is configured), the system PipeWire (user pipewire) owns
     org.pipewire.Telephony; audio-manager (user f250) follows the calls and
     answers, hangs up and dials through it. Root may call it too, for
     busctl when checking on the bench. Nobody else: the system bus's
     default policy denies method calls to it. Harmless when calls are off:
     nobody owns the name. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="pipewire">
    <allow own="org.pipewire.Telephony"/>
  </policy>
  <policy user="f250">
    <allow send_destination="org.pipewire.Telephony"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.pipewire.Telephony"/>
  </policy>
</busconfig>
