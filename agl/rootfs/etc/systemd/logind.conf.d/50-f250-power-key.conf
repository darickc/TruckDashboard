# F-250 head unit: logind ignores the power key (ADR-0013).
#
# The DCDC-USB's PSW pulse arrives on the Pi 5's J2 power-button pads. The
# power-manager service (Phase 6.7) will decide what a pulse means: ignored
# while the ignition is on or the system is booting. Until it exists, the key
# does nothing on AGL; shut down from the dashboard's Power button or over SSH
# with `systemctl poweroff`.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
