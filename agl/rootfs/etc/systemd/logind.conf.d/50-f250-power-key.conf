# F-250 head unit: logind ignores the power key (ADR-0013).
#
# The DCDC-USB's PSW pulse arrives on the Pi 5's J2 power-button pads.
# f250-power-manager.service decides what a press means: ignored inside the
# boot window, otherwise a shutdown (pulse-only, power-states.md).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
