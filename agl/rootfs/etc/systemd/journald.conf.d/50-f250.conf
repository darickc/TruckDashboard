# Installed by agl/scripts/stage1-setup.sh. Keep the journal across reboots,
# so a crash or the Power button's shutdown can be read afterwards
# (`journalctl -b -1`). /var/log is tmpfs on this image; the journal reaches
# the SD card through var-volatile-log-journal.mount. Capped at 50 MB, and
# synced every 5 minutes (the default) to keep SD card writes low.
[Journal]
Storage=persistent
SystemMaxUse=50M
