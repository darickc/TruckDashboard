# bluetoothd with its experimental D-Bus interfaces (ADR-0042): the phone's
# player then has `ObexPort`, the PSM audio-manager needs to fetch the
# track's picture (AVRCP 1.6 cover art). BlueZ 5.86 marks ObexPort and the
# track's ImgHandle experimental (doc/org.bluez.MediaPlayer.rst; player.c
# G_DBUS_PROPERTY_FLAG_EXPERIMENTAL); without this the player has no
# ObexPort and the Media screen shows no pictures.
#
# This replaces the image's ExecStart (bluez5 5.86, Vimba 22.0.1:
# `/usr/libexec/bluetooth/bluetoothd`, read from the built package's
# bluetooth.service). `--experimental` (-E) is bluetoothd's own option
# (src/main.c); main.conf's `Experimental = true` would do the same, but
# that file belongs to the package. Check it again when BlueZ is upgraded.
#
# Status: [SIM] only; UNVERIFIED on the Pi (ADR-0042, bench check).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental
