# Bluetooth belongs to BlueZ, not connman (ADR-0023). connman keeps Wi-Fi and
# Ethernet.
#
# With its bluetooth plugin, connman keeps a Bluetooth "Enable" state of its
# own (false on a new card) and holds the controller rfkill-blocked to match.
# Then BlueZ can't power it, and the MX+ over RFCOMM can't connect. Without
# the plugin, connman ignores the Bluetooth rfkill switch (technology.c: "If
# there is no driver for this type, ignore it"), and bluetoothd powers the
# controller up itself ([Policy] AutoEnable, true by default in BlueZ 5.86).
# The plugin only gave Bluetooth PAN networking, which nothing here uses.
#
# This replaces the image's ExecStart (connman 2.0, Vimba 22.0.1:
# `/usr/sbin/connmand -n`). Check it again when connman is upgraded.
#
# Status: [BENCH] on image 288d091 (bench-log 2026-11-09): Bluetooth powered,
# Wi-Fi unaffected.
[Service]
ExecStart=
ExecStart=/usr/sbin/connmand -n --noplugin=bluetooth
