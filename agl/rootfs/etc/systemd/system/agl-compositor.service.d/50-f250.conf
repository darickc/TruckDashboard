# Installed by agl/scripts/stage1-setup.sh. The image's agl-compositor.service
# has no Restart=: after a crash the panel shows the text console until a
# reboot (bench-log 2026-11-06). Restart it; f250-dashboard.service is
# WantedBy= the compositor, so it comes back with it.
[Service]
Restart=on-failure
RestartSec=2
