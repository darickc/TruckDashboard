# F-250 (bench-log 2026-11-23): Raspberry Pi's rpi-brcmfmac.conf (0x282000) plus
# BRCMF_FEAT_SAE_EXT (bit 25): WPA3 SAE through external auth times out on
# this firmware, so mixed WPA2/WPA3 networks use WPA2. Named to sort after
# rpi-brcmfmac.conf: the last feature_disable wins.
options brcmfmac feature_disable=0x2282000
