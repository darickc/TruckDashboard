# flutter-auto settings for the dashboard bundle. make deploy copies this to
# /usr/share/flutter/f250_infotainment/<flutter version>/release/config.toml.
#
# Same keys as the AGL demo homescreen's config (meta-agl-demo,
# flutter-ics-homescreen/files/ics-homescreen.toml, Vimba), sized for the 7"
# panel. BG: the compositor's background surface, which is what the demo
# homescreen is. UNVERIFIED on the image.
[view]
window_type = "BG"
width = 800
height = 480
fullscreen = true

# Where agl-compositor puts every other app's window: camera-manager's camera
# windows (ADR-0009). Right of the camera buttons (x 0-220) and below the
# status bar (y 0-44), which an alert takes over while a camera shows, so
# alerts stay visible: x = kCameraControlsWidth, y = kStatusBarHeight, the
# rest of the 800x480 screen less one row (apps/infotainment/lib/ui/theme.dart;
# make agl-test checks they agree). A 4:3 picture fills it at 580x435. Owner,
# 2026-11-10: a bigger picture (until then y 96, 800x320, 427x320 for 4:3).
#
# One row short of the bottom on purpose: agl-compositor 0.0.24 ignored an
# area whose bottom edge was the screen's (y 44 + height 436 = 480; also
# 0/44/800/436) and showed the camera full-screen over the status bar and
# the buttons. Height 435 is honoured; a right edge at the screen's (x 220 +
# width 580 = 800) is too. Why: not looked into. [BENCH] 2026-11-10.
[window_activation_area]
x = 220
y = 44
width = 580
height = 435
