# Generic SAE J1979 Mode 01 signals. Formulas are the published J1979 ones,
# as listed in docs/diagnostics/FORD_6_0_PIDS.md ("Generic SAE Mode 01").
# Ranges and stale times mirror apps/infotainment/lib/model/signal_catalog.dart.
# Priority and timeout come from the ESP32 table
# (firmware/esp32/lib/ObdCore/src/PidDefs.cpp) where it has the row; poll
# intervals are budgeted from the measured link throughput (ADR-0019).
# Format: shared/signals/README.md.

- id: rpm
  name: Engine speed
  short_name: RPM
  quantity: rotation
  unit: rpm
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 0C"}
  response: {expect: "41 0C", length: 2}
  decode: {formula: "((A*256)+B)/4", unit: rpm}
  range: {min: 0, max: 5000}
  poll: {priority: 0, interval_ms: 500, timeout_ms: 500}
  stale_after_ms: 1500
  provenance: SAE
  enabled: true
  notes: >-
    Both 0x7E8 and 0x7E9 answer 01 0C and agree (VERIFICATION_LOG.md,
    2026-08-09), so no responder is pinned.

- id: speed
  name: Vehicle speed
  short_name: Speed
  quantity: speed
  unit: km/h
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 0D"}
  response: {expect: "41 0D", length: 1}
  decode: {formula: "A", unit: km/h}
  range: {min: 0, max: 255}
  poll: {priority: 1, interval_ms: 1000, timeout_ms: 500}
  stale_after_ms: 2000
  provenance: SAE
  enabled: true
  calibration:
    scale: 1.0
    offset: 0
    note: "Not measured yet: set from a GPS comparison (docs/diagnostics/CALIBRATION.md)."

- id: ect
  name: Engine coolant temp
  short_name: ECT
  quantity: temperature
  unit: degC
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 05"}
  response: {expect: "41 05", length: 1}
  decode: {formula: "A-40", unit: degC}
  range: {min: -40, max: 150}
  poll: {priority: 3, interval_ms: 1500, timeout_ms: 500}
  stale_after_ms: 4000
  provenance: SAE
  enabled: true

- id: baro
  name: Barometric pressure
  short_name: Baro
  quantity: pressure
  unit: kPa
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 33"}
  response: {expect: "41 33", length: 1}
  decode: {formula: "A", unit: kPa}
  range: {min: 50, max: 110}
  poll: {priority: 5, interval_ms: 5000, timeout_ms: 500}
  stale_after_ms: 20000
  provenance: SAE
  enabled: true
  notes: Input for the computed boost signal (map - baro).

- id: iat
  name: Intake air temp
  short_name: IAT
  quantity: temperature
  unit: degC
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 0F"}
  response: {expect: "41 0F", length: 1}
  decode: {formula: "A-40", unit: degC}
  range: {min: -40, max: 120}
  poll: {priority: 5, interval_ms: 3000, timeout_ms: 500}
  stale_after_ms: 8000
  provenance: SAE
  enabled: true
  notes: >-
    Standard J1979 formula. Not in the ESP32 table, so the priority is a
    software choice; the interval is budgeted (ADR-0019).

- id: load
  name: Engine load
  short_name: Load
  quantity: percent
  unit: "%"
  source: diagnostic
  request: {protocol: iso15765, tx_id: "0x7DF", payload: "01 04"}
  response: {expect: "41 04", length: 1}
  decode: {formula: "A*100/255", unit: "%"}
  range: {min: 0, max: 100}
  poll: {priority: 4, interval_ms: 1000, timeout_ms: 500}
  stale_after_ms: 2000
  provenance: SAE
  enabled: true
