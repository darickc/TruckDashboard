syntax = "proto3";

// Which camera is on screen, served by services/camera-manager
// (docs/architecture/adr/0026-camera-manager-interfaces.md). The dashboard
// draws around the camera's window from this; it never opens a camera
// itself. power-manager sends the camera switch's moves here.
package f250.camera.v1;

service CameraService {
  // The view now, then again each time it changes. A client that loses the
  // stream must assume the camera state is unknown.
  rpc WatchView(WatchViewRequest) returns (stream WatchViewResponse);
  // One debounced move of the camera switch (or an on-screen equivalent).
  rpc Move(MoveRequest) returns (MoveResponse);
  // Front and rear recording (ADR-0027 decision 9, added 2026-11-10): the
  // state now, then again each time it changes. A client that loses the
  // stream must assume nothing is recording: it never shows REC on its own.
  rpc WatchRecording(WatchRecordingRequest) returns (stream WatchRecordingResponse);
  // "Save clip" (ADR-0027 decision 8): protects the segment being written
  // and the minutes around it from retention. Refused, with a reason, when
  // nothing is recording or the saved clips are full.
  rpc SaveClip(SaveClipRequest) returns (SaveClipResponse);
}

enum Camera {
  CAMERA_UNSPECIFIED = 0;
  CAMERA_LEFT = 1;
  CAMERA_RIGHT = 2;
  CAMERA_REAR = 3;
  // Added 2026-11-10: the switch's forward move shows it by default.
  CAMERA_FRONT = 4;
}

enum SwitchMove {
  SWITCH_MOVE_UNSPECIFIED = 0;
  SWITCH_MOVE_LEFT = 1;
  SWITCH_MOVE_RIGHT = 2;
  SWITCH_MOVE_BACK = 3;
  SWITCH_MOVE_FORWARD = 4;
  SWITCH_MOVE_PRESS = 5;
}

// Why a camera is on screen.
enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_REVERSE = 1;
  REASON_SWITCH = 2;
}

// The reverse signal, for the dashboard's indicator.
enum ReverseStatus {
  REVERSE_STATUS_UNSPECIFIED = 0;
  // Automatic reverse is switched off in camera-manager's configuration.
  REVERSE_STATUS_OFF = 1;
  // Stale, invalid or never received: must be shown as unknown.
  REVERSE_STATUS_UNKNOWN = 2;
  REVERSE_STATUS_NOT_ENGAGED = 3;
  REVERSE_STATUS_ENGAGED = 4;
}

// The chosen camera's feed.
enum FeedState {
  FEED_STATE_UNSPECIFIED = 0;
  // The pipeline is starting and hasn't delivered a frame yet.
  FEED_STATE_STARTING = 1;
  // Frames are arriving; the camera's window is on screen.
  FEED_STATE_LIVE = 2;
  // No frames (no device, a failed pipeline, frames stopped). The window is
  // closed; the dashboard shows "Camera unavailable" in its place.
  FEED_STATE_UNAVAILABLE = 3;
}

message View {
  // The camera on screen. Unset (CAMERA_UNSPECIFIED): no camera, the
  // dashboard shows the screen it showed before.
  Camera camera = 1;
  Reason reason = 2;
  // Meaningful only while `camera` is set.
  FeedState feed = 3;
  // Why the feed is unavailable, for the log and a detail line on screen.
  string feed_detail = 4;
  ReverseStatus reverse = 5;
  // A camera is chosen, but the speed limit (or an unknown speed) hides it.
  bool blocked_by_speed = 6;
}

message WatchViewRequest {}

message WatchViewResponse {
  View view = 1;
}

message MoveRequest {
  SwitchMove move = 1;
  // Who sent it ("power-manager", "dashboard"), for the log.
  string source = 2;
}

message MoveResponse {
  // The view right after the move.
  View view = 1;
}

// One recorded camera's state (ADR-0027 decisions 1 and 9).
enum RecordingState {
  RECORDING_STATE_UNSPECIFIED = 0;
  // The camera is set to record and the pipeline is starting: no segment
  // has received a frame yet.
  RECORDING_STATE_STARTING = 1;
  // Frames are reaching a segment on the data drive.
  RECORDING_STATE_RECORDING = 2;
  // Set to record but not recording: no drive, no device, the drive is
  // full, frames stopped, or this build can't record. `detail` says which.
  // The dashboard raises an advisory for it: a dead dashcam must not be
  // discovered after the incident it missed.
  RECORDING_STATE_NOT_RECORDING = 3;
}

message CameraRecording {
  Camera camera = 1;
  RecordingState state = 2;
  // Why it isn't recording, or what it is waiting for.
  string detail = 3;
  // The segment being written (file name only), while recording.
  string segment = 4;
}

message Recording {
  // The cameras set to record (RECORD_CAMERAS), in that order. Empty:
  // recording is off.
  repeated CameraRecording cameras = 1;
  // A data drive is mounted where recordings go. Without it nothing
  // records and the SD card is never used (ADR-0027 decision 6).
  bool drive_mounted = 2;
  // Free space on the drive and the unprotected video on it, from the last
  // retention pass; meaningful only while drive_mounted.
  uint64 drive_free_bytes = 3;
  uint64 recorded_bytes = 4;
  // Saved clips and their cap (RECORD_PROTECTED_MAX_GB).
  uint64 protected_bytes = 5;
  uint64 protected_max_bytes = 6;
  // Segments still to be moved into a saved clip as they finish.
  uint32 clip_segments_pending = 7;
  // The clock is trusted now (NTP synchronized): segment names carry the
  // wall time, and the age limit applies.
  bool clock_trusted = 8;
  // Something the driver should know that isn't one camera's: the drive is
  // full with nothing left to delete, or the minutes before an unclean stop
  // didn't all fit in the saved clips. Empty when nothing is wrong.
  string problem = 9;
}

message WatchRecordingRequest {}

message WatchRecordingResponse {
  Recording recording = 1;
}

message SaveClipRequest {
  // Who asked ("dashboard"), for the log.
  string source = 1;
}

message SaveClipResponse {
  // False: nothing was protected, and `detail` says why.
  bool saved = 1;
  // What happened, in words for the screen.
  string detail = 2;
  // Finished segments moved into the saved clips now.
  uint32 segments_protected = 3;
  // Segments that will be moved as they finish (the one being written and
  // the ones after it), across the cameras.
  uint32 segments_to_come = 4;
}
