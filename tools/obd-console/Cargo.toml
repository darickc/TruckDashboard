[package]
name = "obd-console"
version = "0.1.0"
description = "Interactive console for the vehicle gateway's diagnostics API (Pi-side equivalent of the ESP32 serial console)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
f250-proto = { path = "../../crates/proto" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
