# Rust workspace: libraries in crates/, daemons in services/, CLIs in tools/
# (ADR-0008). Build with `make rust-test`; see CLAUDE.md.
[workspace]
resolver = "3"
members = [
    "crates/elm",
    "crates/telemetry",
    "crates/powerstroke-sim",
    "crates/proto",
    "crates/sd-notify",
    "services/vehicle-gateway",
    "services/recorder",
    "tools/obd-console",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
