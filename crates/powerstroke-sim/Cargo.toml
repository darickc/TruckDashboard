[package]
name = "powerstroke-sim"
version = "0.1.0"
description = "Deterministic 6.0L Power Stroke scenario engine (reads simulator/powerstroke/scenarios, f250.scenario.v1)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
yaml_serde = "0.10.7"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # exact parse of Dart's shortest doubles

[lints]
workspace = true
