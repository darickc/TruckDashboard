[package]
name = "f250-sd-notify"
version = "0.1.0"
description = "systemd notify protocol (READY, STATUS, STOPPING, WATCHDOG) and a progress-gated watchdog for the head-unit daemons"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `run_watchdog`, the keep-alive loop the daemons spawn on their tokio runtime.
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "test-util"] }

[lints]
workspace = true
