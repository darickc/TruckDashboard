; The knob display (ADR-0044): Waveshare ESP32-S3-Knob-Touch-LCD-1.8, a round
; 360x360 gauge and the volume knob, on one USB cable to the Pi.
;
; Environments:
;   knob   — the ESP32-S3's firmware: the USB link (serial + HID knob), the
;            model, and lib/KnobHw's display, touch and knob drivers (pins
;            and the panel's start-up from Waveshare's schematic and demo).
;            Runs on the bench board; the dial isn't drawn yet (a test
;            pattern).
;   native — host tests of lib/KnobCore (Unity).
;
; Usage:
;   pio run -e knob
;   pio test -e native

[platformio]
default_envs = knob

[env:knob]
; arduino-esp32 3.x (ESP-IDF 5.5) through pioarduino, not the 2.x the ESP32
; firmware uses: the panel is QSPI, and IDF 4.4's esp_lcd has no quad mode
; (Waveshare's demo needs core >= 3.2.0). Its USB library still has USBCDC and
; USBHIDConsumerControl on the S3 (TinyUSB). Pinned to a release, not "latest";
; 55.03.311 (core 3.3.11, IDF 5.5.5) because 55.03.312 needs PlatformIO Core
; >= 6.2.0, which Core 6.2.0 fails: it calls itself 6.2.0.post1, a semver
; pre-release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; The board's ESP32-S3R8: 8 MB octal PSRAM and 16 MB flash (Waveshare's page).
; qio_opi: quad flash, octal PSRAM; the board reports 8 MB PSRAM with it
; (bench, 2026-11-22).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Once this firmware runs, the port is TinyUSB's, not the S3's serial/JTAG, and
; esptool's reset lines don't reach the chip: open it at 1200 baud to restart
; into the loader, then wait for the loader's port (BOOT held at power-on also
; works).
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; 3.x's USB library has mass-storage sources that include FS.h; the library
; finder doesn't pull FS in on its own.
lib_deps = FS
; The board file sets USB mode 1 (the S3's built-in serial/JTAG); this needs
; 0 (TinyUSB), so its flag is removed first.
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; The S3's own USB as a TinyUSB composite device (serial + HID), with
    ; Serial on it from boot.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The S3R8's 8 MB PSRAM (esptool: "Embedded PSRAM 8MB"); without this
    ; 3.x leaves it off.
    -DBOARD_HAS_PSRAM
    ; With CDC on boot, USB starts before setup(), so the names that
    ; /dev/serial/by-id and lsusb show are set here, not in setup().
    '-DUSB_PRODUCT="F-250 knob"'
    '-DUSB_MANUFACTURER="TruckDashboard"'
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
