; The knob display (ADR-0044): Waveshare ESP32-S3-Knob-Touch-LCD-1.8, a round
; 360x360 gauge and the volume knob, on one USB cable to the Pi.
;
; Environments:
;   knob   — the ESP32-S3's firmware. The board isn't here yet: the USB link
;            (serial + HID knob) and the model run; the display, touch and
;            encoder drivers are TODO (their pins and the ST77916's start-up
;            come from Waveshare's demo, not read yet). Builds; never run.
;   native — host tests of lib/KnobCore (Unity).
;
; Usage:
;   pio run -e knob
;   pio test -e native

[platformio]
default_envs = knob

[env:knob]
; arduino-esp32 2.x, as the other firmware: its USB library has USBCDC and
; USBHIDConsumerControl on the S3 (TinyUSB).
platform = espressif32@^6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; The board's ESP32-S3R8: 8 MB octal PSRAM and 16 MB flash (Waveshare's page).
; The memory type below is what an S3R8 takes; UNVERIFIED on this board.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; The board file sets USB mode 1 (the S3's built-in serial/JTAG); this needs
; 0 (TinyUSB), so its flag is removed first.
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; The S3's own USB as a TinyUSB composite device (serial + HID), with
    ; Serial on it from boot.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
