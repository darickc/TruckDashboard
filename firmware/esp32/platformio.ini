; TruckDashboard — ESP32 digital gauge for 2007 Ford F-250 6.0L Power Stroke
;
; Environments:
;   esp32dev — firmware for the ESP32-WROOM-32 dev board (Bluetooth Classic required,
;              which is why this project targets the original ESP32, NOT the S3).
;   native   — host-side unit tests (Unity). Only the platform-independent core
;              (lib/ObdCore) is compiled here; Arduino-touching libs are excluded.
;
; Usage:
;   pio run -e esp32dev            # build firmware
;   pio run -e esp32dev -t upload  # flash over USB (CP2102)
;   pio device monitor             # view logs at 115200
;   pio test -e native             # run unit tests on the host

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 6.x pins arduino-esp32 core 2.x, which has the mature/stable
; BluetoothSerial master-mode (SPP) implementation this project depends on.
platform = espressif32@^6.12.0
board = esp32dev
framework = arduino
; BluetoothSerial adds ~1 MB to the image; the default 1.25 MB app partition
; will not fit. huge_app = 3 MB app, no OTA (this unit is flashed over USB).
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; arduino-esp32 2.x defaults to gnu++11; both flags below are required to get C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Compile-time log floor: 0=OFF 1=ERROR 2=WARN 3=INFO 4=DEBUG 5=TRACE.
    ; Calls below the floor compile out entirely (zero cost in hot paths).
    -DTD_LOG_LEVEL=5
    -DCORE_DEBUG_LEVEL=2
; Unit tests run on the host only.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DTD_NATIVE
    -DTD_LOG_LEVEL=2
    -Wall
    -Wextra
; Arduino-dependent libraries must never be compiled on the host.
lib_ignore = ObdBt, Display, Telemetry, Sensors
