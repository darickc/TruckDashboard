name: vector_map_tiles
description: A plugin for `flutter_map` that enables the use of vector tiles.
# 9.0.0-beta.13 from pub.dev, patched for the F-250 dashboard: see F250_PATCH.md.
version: 9.0.0-beta.13+f250.1
publish_to: none
homepage: https://github.com/greensopinion/flutter-vector-map-tiles

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.1
  http: ^1.0.0
  latlong2: ^0.10.1
  path_provider: ^2.0.2
  vector_tile_renderer: ^6.1.0
  async: ^2.8.2
  executor_lib: ^1.1.1
  idb_shim: ^2.6.1+7
