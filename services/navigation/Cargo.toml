[package]
name = "navigation"
version = "0.1.0"
description = "The truck's position from gpsd (or a simulated receiver), routes from Valhalla and offline address search, served as f250.nav.v1 (Phase 6.4/6.5.2/6.5.3, ADR-0030, ADR-0035, ADR-0038)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "navigation"
path = "src/lib.rs"

[[bin]]
name = "navigation"
path = "src/main.rs"

[dependencies]
f250-geocode = { path = "../../crates/geocode" }
f250-gpsd = { path = "../../crates/gpsd" }
f250-proto = { path = "../../crates/proto" }
serde_json = "1.0.154"
f250-sd-notify = { path = "../../crates/sd-notify", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# The end-to-end test's client over a unix socket, as the recorder does.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[lints]
workspace = true
