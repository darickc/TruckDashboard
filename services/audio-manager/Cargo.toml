[package]
name = "audio-manager"
version = "0.1.0"
description = "Bluetooth audio from a phone (A2DP sink, AVRCP, a pairing window) and the speakers' PipeWire filter-chain, served as f250.audio.v1 (Phase 6.1, ADR-0039)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "audio_manager"
path = "src/lib.rs"

[[bin]]
name = "audio-manager"
path = "src/main.rs"

[dependencies]
f250-proto = { path = "../../crates/proto" }
f250-sd-notify = { path = "../../crates/sd-notify", features = ["tokio"] }
# The volume knob from /dev/input (ADR-0043).
f250-evdev = { path = "../../crates/evdev" }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
clap = { version = "4", features = ["derive"] }
# BlueZ over the system D-Bus. Pure Rust (no libdbus), so it builds and is
# linted on the Mac too; it only connects on Linux.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Paused time for the simulated calls' timers.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[lints]
workspace = true
