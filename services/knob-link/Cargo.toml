[package]
name = "knob-link"
version = "0.1.0"
description = "Feeds the knob display (ADR-0044): vehicle-gateway's snapshots as frames on the dial's USB serial port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "knob_link"
path = "src/lib.rs"

[[bin]]
name = "knob-link"
path = "src/main.rs"

[dependencies]
f250-proto = { path = "../../crates/proto" }
f250-sd-notify = { path = "../../crates/sd-notify", features = ["tokio"] }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
# The dial's USB serial port, as the gateway opens the MX+ (raw mode).
tokio-serial = "5"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
# The phone's cover for the dial's media page: decoded (JPEG from a phone,
# BMP from the simulated one, PNG), cropped and scaled here (art.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[lints]
workspace = true
