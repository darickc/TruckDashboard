[package]
name = "power-manager"
version = "0.1.0"
description = "Head unit power manager: the DCDC-USB's PSW pulse on the Pi 5 power key, pulse-only (ADR-0013)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "power_manager"
path = "src/lib.rs"

[[bin]]
name = "power-manager"
path = "src/main.rs"

[dependencies]
f250-sd-notify = { path = "../../crates/sd-notify", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util"] }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
