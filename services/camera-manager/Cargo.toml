[package]
name = "camera-manager"
version = "0.1.0"
description = "Runs the camera on screen as a gst-launch pipeline, applies the camera policy, and serves f250.camera.v1 (ADR-0026)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "camera_manager"
path = "src/lib.rs"

[[bin]]
name = "camera-manager"
path = "src/main.rs"

[dependencies]
f250-camera-policy = { path = "../../crates/camera-policy" }
f250-proto = { path = "../../crates/proto" }
f250-sd-notify = { path = "../../crates/sd-notify", features = ["tokio"] }
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }

[lints]
workspace = true
