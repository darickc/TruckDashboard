[package]
name = "tts"
version = "0.1.0"
description = "The spoken directions' voice (ADR-0048): Piper kept loaded, a WAV for each prompt over a unix socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tts"
path = "src/lib.rs"

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# dlopen/dlsym for libpiper, loaded at run time (src/piper.rs), and recv
# with MSG_PEEK to notice a client that hung up.
libc = "0.2"

# The workspace's lints, except unsafe_code: "deny" here, not "forbid", so
# that src/piper.rs alone can allow it for the calls into libpiper
# (ADR-0048). Everything else in the crate is still refused unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
